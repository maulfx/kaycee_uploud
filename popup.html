<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <title>Kaycee :3 - Beta</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --primary: #c084fc;
            --primary-deep: #7e22ce;
            --accent: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.45);
            --bg-gradient: radial-gradient(ellipse 90% 55% at 20% 0%, rgba(192, 132, 252, 0.3) 0%, transparent 55%),
                           radial-gradient(ellipse 70% 50% at 85% 25%, rgba(147, 51, 234, 0.38) 0%, transparent 55%),
                           radial-gradient(circle at 15% 70%, rgba(126, 34, 206, 0.42) 0%, transparent 55%),
                           radial-gradient(circle at 85% 90%, rgba(88, 28, 135, 0.65) 0%, transparent 60%),
                           linear-gradient(160deg, #160829 0%, #230b42 30%, #140526 70%, #0a0314 100%);
            --glass-card-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.22);
            --glass-box-bg: rgba(255, 255, 255, 0.10);
            --glass-pill-bg: rgba(255, 255, 255, 0.14);
            --text-title: #ffffff;
            --text-sub: rgba(243, 232, 255, 0.88);
            --text-muted: rgba(216, 180, 254, 0.70);
            --liquid-rim: inset 0 1px 1.5px rgba(255, 255, 255, 0.5), inset 0 -1px 1px rgba(0, 0, 0, 0.25);
        }

        body.light-mode {
            --primary: #9333ea;
            --primary-deep: #6b21a8;
            --accent: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.25);
            --bg-gradient: radial-gradient(ellipse 90% 55% at 20% 0%, rgba(243, 232, 255, 0.95) 0%, transparent 55%),
                           radial-gradient(ellipse 70% 50% at 85% 25%, rgba(233, 213, 255, 0.85) 0%, transparent 55%),
                           radial-gradient(circle at 15% 70%, rgba(216, 180, 254, 0.75) 0%, transparent 55%),
                           linear-gradient(160deg, #faf5ff 0%, #f3e8ff 35%, #e9d5ff 75%, #d8b4fe 100%);
            --glass-card-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(147, 51, 234, 0.25);
            --glass-box-bg: rgba(255, 255, 255, 0.60);
            --glass-pill-bg: rgba(255, 255, 255, 0.70);
            --text-title: #2e1065;
            --text-sub: #4c1d95;
            --text-muted: #7e22ce;
            --liquid-rim: inset 0 1px 1.5px rgba(255, 255, 255, 0.9), inset 0 -1px 1px rgba(147, 51, 234, 0.15);
        }

        ::-webkit-scrollbar { display: none; width: 0 !important; height: 0 !important; background: transparent; }
        html { overflow: hidden !important; }

        body {
            margin: 0; padding: 0;
            width: 320px;
            height: 480px;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-title);
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
            overflow: hidden !important;
            user-select: none;
            box-sizing: border-box;
            position: relative;
            transition: background 0.4s ease;
        }

        /* Ambient Liquid Glow */
        .ambient-glow {
            position: absolute; inset: 0; pointer-events: none; z-index: 0;
            background: radial-gradient(circle at 50% 120%, var(--accent-glow) 0%, transparent 60%);
            transition: background 0.4s ease;
        }

        /* Full View Container (Liquid Glass, Edge-to-Edge) */
        .view-container {
            width: 100%; height: 100%;
            position: absolute; top: 0; left: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 16px 16px 14px 16px;
            box-sizing: border-box;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .hidden-left { transform: translateX(-100%); opacity: 0; pointer-events: none; }
        .hidden-right { transform: translateX(100%); opacity: 0; pointer-events: none; }
        .hidden { display: none !important; }

        /* Top Navigation Bar */
        .top-nav-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 20;
        }

        .brand-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--glass-pill-bg);
            border: 1px solid var(--glass-border);
            padding: 5px 10px;
            border-radius: 9999px;
            font-size: 11.5px;
            font-weight: 800;
            color: var(--text-title);
            letter-spacing: 0.3px;
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15), var(--liquid-rim);
        }

        .beta-badge {
            background: linear-gradient(135deg, var(--accent), var(--primary-deep));
            color: #ffffff;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 9999px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .glass-btn-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--glass-pill-bg);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-title);
            cursor: pointer;
            transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 11px;
            font-weight: 800;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12), var(--liquid-rim);
        }
        .glass-btn-icon:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.28);
            box-shadow: 0 0 14px var(--accent-glow);
        }
        .glass-btn-icon:active { transform: scale(0.94); }
        .glass-btn-icon svg { width: 15px; height: 15px; fill: currentColor; }

        /* Liquid Glass Color Palette Bar (Flyout) */
        .color-palette-bar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--glass-card-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 9999px;
            padding: 6px 12px;
            margin-top: 6px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25), var(--liquid-rim);
            animation: flyoutSlide 0.25s ease-out;
        }

        @keyframes flyoutSlide {
            from { opacity: 0; transform: translateY(-8px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .color-dot-btn {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }
        .color-dot-btn:hover {
            transform: scale(1.25);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }
        .color-custom-wheel {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.9);
            background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }
        .color-custom-wheel:hover { transform: scale(1.25); }

        /* User Profile Hero Section */
        .user-hero-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            margin-top: 2px;
        }

        .avatar-ring-wrap {
            padding: 3px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), var(--primary) 40%, var(--primary-deep) 100%);
            box-shadow: 0 8px 26px var(--accent-glow);
            display: inline-block;
            margin-bottom: 8px;
            transition: box-shadow 0.4s ease;
        }

        .avatar-circle {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-deep), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.9);
            position: relative;
            overflow: hidden;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            position: absolute;
            inset: 0;
        }

        .profile-name {
            font-size: 19px;
            font-weight: 800;
            color: var(--text-title);
            margin: 0;
            letter-spacing: -0.3px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.25);
            max-width: 270px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-tagline {
            font-size: 11.5px;
            color: var(--text-sub);
            margin: 3px 0 0 0;
            font-weight: 500;
            line-height: 1.35;
        }

        /* 60FPS Force Badge (Minimal & Liquid Glass) */
        .feature-status-banner {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: var(--glass-box-bg);
            border: 1px solid var(--glass-border);
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 800;
            color: var(--text-title);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15), var(--liquid-rim);
        }

        .feat-badge-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
            animation: pulseDot 2s infinite;
        }

        /* 2 Action Pill Buttons (Live Stats & Downloader) */
        .action-pills-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        .action-pill-btn {
            background: var(--glass-pill-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            font-size: 11.5px;
            font-weight: 800;
            color: var(--text-title);
            cursor: pointer;
            transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            outline: none;
            font-family: inherit;
            letter-spacing: 0.3px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15), var(--liquid-rim);
        }
        .action-pill-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22), var(--liquid-rim);
            border-color: rgba(255, 255, 255, 0.4);
        }
        .action-pill-btn:active { transform: scale(0.97); }
        .action-pill-btn svg {
            width: 16px; height: 16px; fill: currentColor; flex-shrink: 0;
        }

        /* Master Toggle White Pill Button */
        .master-toggle-wrap {
            width: 100%;
        }

        .master-pill-btn {
            width: 100%;
            height: 48px;
            border-radius: 9999px;
            border: none;
            background: #ffffff;
            color: var(--primary-deep);
            font-size: 13.5px;
            font-weight: 800;
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            cursor: pointer;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .master-pill-btn:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
        }

        .master-pill-btn:active {
            transform: scale(0.98);
        }

        /* Active State */
        .master-toggle-wrap.active .master-pill-btn {
            background: #ffffff;
            color: var(--primary-deep);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35), 0 0 22px var(--accent-glow);
        }

        /* Inactive State */
        .master-toggle-wrap:not(.active) .master-pill-btn {
            background: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.85);
            box-shadow: none;
            border: 1.5px solid rgba(255, 255, 255, 0.35);
        }

        .pill-status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--primary-deep);
            box-shadow: 0 0 10px var(--primary-deep);
            transition: all 0.3s;
        }

        .master-toggle-wrap.active .pill-status-dot {
            background: var(--primary-deep);
            box-shadow: 0 0 12px var(--primary);
            animation: pulseDot 1.5s infinite;
        }

        .master-toggle-wrap:not(.active) .pill-status-dot {
            background: rgba(255, 255, 255, 0.5);
            box-shadow: none;
            animation: none;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.35); opacity: 0.65; }
        }

        .shake-animation {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        /* Footer */
        .card-footer {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .footer-dot { opacity: 0.6; }

        /* ==============================================================
           PANEL STYLING FOR STATS & DOWNLOADER (Edge-to-Edge)
           ============================================================== */
        .panel-full-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--glass-border);
        }

        .panel-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--text-title);
            letter-spacing: 0.3px;
        }

        .back-circle-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--glass-pill-bg);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-title);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--liquid-rim);
        }
        .back-circle-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.3);
        }
        .back-circle-btn svg { width: 16px; height: 16px; fill: currentColor; }

        /* Search input inside Downloader */
        .glass-search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--glass-box-bg);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 4px 6px 4px 12px;
            margin-bottom: 12px;
            box-shadow: var(--liquid-rim);
        }

        .glass-search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-title);
            font-family: inherit;
            font-size: 12.5px;
        }
        .glass-search-box input::placeholder { color: var(--text-muted); }

        .glass-search-btn {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: #ffffff;
            border: none;
            color: var(--primary-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .glass-search-btn:hover { transform: scale(1.05); }
        .glass-search-btn svg { width: 15px; height: 15px; fill: currentColor; }

        .glass-result-card {
            background: var(--glass-box-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: var(--liquid-rim);
        }

        .glass-cover {
            width: 100%;
            height: 120px;
            border-radius: 12px;
            background-size: cover;
            background-position: center;
            background-color: rgba(0, 0, 0, 0.3);
        }

        .glass-desc {
            font-size: 11px;
            color: var(--text-title);
            font-weight: 500;
            line-height: 1.35;
        }

        .glass-actions-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 8px;
        }

        .dl-pill-btn {
            background: #ffffff;
            color: var(--primary-deep);
            border: none;
            border-radius: 9999px;
            padding: 8px 12px;
            font-size: 11.5px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: transform 0.2s;
        }
        .dl-pill-btn:hover { transform: translateY(-1px); }
        .dl-pill-btn svg { width: 14px; height: 14px; fill: currentColor; }

        /* Video List in Stats View */
        .stats-user-banner {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--glass-box-bg);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 9px 12px;
            margin-bottom: 10px;
            box-shadow: var(--liquid-rim);
        }

        .avatar-small {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-deep), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
            color: #fff;
            border: 1.5px solid #fff;
            background-size: cover;
        }

        .stats-username {
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text-title);
        }

        .live-tag {
            font-size: 9px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: 0.5px;
        }

        .video-list-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .video-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--glass-box-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 8px 10px;
            transition: transform 0.2s;
            box-shadow: var(--liquid-rim);
        }
        .video-item:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.18); }

        .vid-thumb {
            width: 36px;
            height: 48px;
            border-radius: 6px;
            background-size: cover;
            background-position: center;
            background-color: rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
        }

        .vid-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            text-align: left;
            min-width: 0;
            max-width: 140px;
        }

        .vid-date {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-title);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .vid-status {
            font-size: 9.5px;
            color: var(--text-sub);
        }

        .engagement-badge {
            font-size: 9px;
            color: var(--primary);
            font-weight: 700;
        }

        .vid-views {
            font-size: 11px;
            font-weight: 800;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <!-- MAIN VIEW -->
    <div id="mainView" class="view-container">
        
        <!-- Top Navigation Bar -->
        <div class="top-nav-bar">
            <div class="brand-pill">
                <span>✨</span> Kaycee :3 <span class="beta-badge">Beta</span>
            </div>
            <div class="top-actions">
                <div class="glass-btn-icon" id="colorPickerBtn" title="Custom Warna Tema">
                    <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.31 19.57 10.6 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 2c3.87 0 7 3.13 7 7 0 1.34-.38 2.59-1.03 3.65l-2.07-2.07c.37-.48.6-1.07.6-1.73 0-1.66-1.34-3-3-3-.66 0-1.25.23-1.73.6L11.72 7.4A6.98 6.98 0 0 1 12 5z"/></svg>
                </div>
                <div class="glass-btn-icon" id="logoutBtn" title="Perbarui Akun TikTok">
                    <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                </div>
                <div class="glass-btn-icon" id="langBtn" title="Language (EN / ID)">EN</div>
                <div class="glass-btn-icon" id="themeBtn" title="Ganti Tema (Dark / Light)">
                    <svg class="icon-moon" viewBox="0 0 24 24"><path d="M12.3 2a10 10 0 0 0 9.7 13.7 10 10 0 1 1-13.7-9.7 1 1 0 0 1 1.4-1.4 10 10 0 0 0 2.6-2.6z"/></svg>
                    <svg class="icon-sun hidden" viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5a1 1 0 0 0-1 1v2a1 1 0 0 0 2 0V3a1 1 0 0 0-1-1zm0 18a1 1 0 0 0-1 1v2a1 1 0 0 0 2 0v-2a1 1 0 0 0-1-1zm10-9h-2a1 1 0 0 0 0 2h2a1 1 0 0 0 0-2zM4 11H2a1 1 0 0 0 0 2h2a1 1 0 0 0 0-2zm14.07-6.07a1 1 0 0 0-1.41 0l-1.42 1.42a1 1 0 1 0 1.42 1.41l1.41-1.41a1 1 0 0 0 0-1.42zM7.34 16.66a1 1 0 0 0-1.41 0l-1.42 1.42a1 1 0 1 0 1.42 1.41l1.41-1.41a1 1 0 0 0 0-1.42zm11.32 11.32a1 1 0 0 0 0-1.42l-1.41-1.41a1 1 0 1 0-1.42 1.41l1.41 1.42a1 1 0 0 0 1.42 0zM6.93 6.93a1 1 0 0 0 0-1.42L5.51 4.09a1 1 0 1 0-1.41 1.42l1.41 1.42a1 1 0 0 0 1.42 0z"/></svg>
                </div>
            </div>
        </div>

        <!-- Custom Color Flyout Bar (Hidden by default) -->
        <div id="colorPaletteBar" class="color-palette-bar hidden">
            <div class="color-dot-btn" data-color="#a855f7" style="background:#a855f7;" title="Royal Violet"></div>
            <div class="color-dot-btn" data-color="#06b6d4" style="background:#06b6d4;" title="Cyber Cyan"></div>
            <div class="color-dot-btn" data-color="#ec4899" style="background:#ec4899;" title="Neon Rose"></div>
            <div class="color-dot-btn" data-color="#10b981" style="background:#10b981;" title="Emerald Green"></div>
            <div class="color-dot-btn" data-color="#f97316" style="background:#f97316;" title="Solar Orange"></div>
            <div class="color-dot-btn" data-color="#3b82f6" style="background:#3b82f6;" title="Ocean Blue"></div>
            <div class="color-custom-wheel" id="customColorWheelBtn" title="Pilih Warna Bebas"></div>
            <input type="color" id="nativeColorPicker" style="display:none;" value="#a855f7">
        </div>

        <!-- User Profile Hero Section -->
        <div class="user-hero-section">
            <div class="avatar-ring-wrap">
                <div class="avatar-circle" id="userAvatar">
                    <img id="userAvatarImg" class="avatar-img hidden" alt="" referrerpolicy="no-referrer">
                    <span id="userAvatarLetter">K</span>
                </div>
            </div>
            <div class="profile-name" id="userDisplayName">Kaycee :3</div>
            <div class="profile-tagline" data-key="tagline">“60FPS Lossless Upload Booster”</div>
        </div>

        <!-- 60 FPS Force Badge (Simple Liquid Glass) -->
        <div class="feature-status-banner">
            <span class="feat-badge-dot"></span>
            <span class="feat-badge-text" data-key="feat_60fps">60 FPS FORCE</span>
        </div>

        <!-- 2 Action Pill Buttons -->
        <div class="action-pills-row">
            <button type="button" class="action-pill-btn" id="statsBtn">
                <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
                <span data-key="stats_title">LIVE STATS</span>
            </button>
            <button type="button" class="action-pill-btn" id="dlPageBtn">
                <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
                <span data-key="dl_title">DOWNLOADER</span>
            </button>
        </div>

        <!-- Master White Pill Button -->
        <div class="master-toggle-wrap active" id="mainCard">
            <input type="checkbox" id="toggleBtn" style="display: none;" checked>
            <button type="button" class="master-pill-btn" id="masterPillTrigger">
                <span class="pill-status-dot"></span>
                <span id="statusText" data-key="status_on">SYSTEM ACTIVE</span>
            </button>
        </div>

        <!-- Footer -->
        <div class="card-footer">
            <span data-key="footer_made">Kaycee :3</span>
            <span class="footer-dot">•</span>
            <span class="beta-badge" style="padding: 1px 5px; font-size: 8.5px;">Beta</span>
            <span class="footer-dot">•</span>
            <span data-key="footer_status">ONLINE</span>
        </div>

    </div>

    <!-- STATS VIEW -->
    <div id="statsView" class="view-container hidden-right">
        <div class="panel-full-content">
            <div class="panel-header">
                <div class="back-circle-btn" id="backToMainBtn" title="Kembali">
                    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </div>
                <div class="panel-title" data-key="stats_panel_title">VIDEO ANALYSIS</div>
                <div style="width: 30px;"></div>
            </div>

            <div class="stats-user-banner">
                <div class="avatar-small" id="statsAvatar">K</div>
                <div style="text-align: left;">
                    <div class="stats-username" id="statsUsername">@user</div>
                    <div class="live-tag" data-key="live_tag_static">LIVE DATA</div>
                </div>
            </div>

            <div style="background: var(--glass-box-bg); border: 1px solid var(--glass-border); border-radius: 12px; margin-bottom: 10px; padding: 10px; box-shadow: var(--liquid-rim);">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div style="text-align: left;">
                        <div style="font-size: 9.5px; font-weight: 700; color: var(--text-sub); text-transform: uppercase;" data-key="best_time_title">BEST UPLOAD TIME</div>
                        <div id="bestTimeResult" style="font-size: 14.5px; font-weight: 800; color: var(--text-title);" data-key="best_time_calc">Calculating...</div>
                    </div>
                    <div id="bestTimeViews" style="font-size: 11px; color: var(--primary); font-weight: 800;"></div>
                </div>
            </div>

            <div class="video-list-container" id="videoList"></div>
        </div>
    </div>

    <!-- DOWNLOADER VIEW -->
    <div id="dlView" class="view-container hidden-right">
        <div class="panel-full-content">
            <div class="panel-header">
                <div class="back-circle-btn" id="backFromDl" title="Kembali">
                    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </div>
                <div class="panel-title" data-key="dl_panel_title">MEDIA DOWNLOADER</div>
                <div style="width: 30px;"></div>
            </div>

            <div class="glass-search-box">
                <input type="text" id="dlUrlInput" placeholder="Paste TikTok Link..." autocomplete="off">
                <button id="analyzeBtn" class="glass-search-btn" title="Cari & Download">
                    <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
                </button>
            </div>

            <div id="dlResultArea" class="hidden" style="flex: 1; overflow-y: auto;">
                <div class="glass-result-card">
                    <div id="dlCover" class="glass-cover"></div>
                    <div style="text-align: left;">
                        <div id="dlAuthor" style="font-size: 11.5px; font-weight: 800; color: var(--primary);">@author</div>
                        <div id="dlDesc" class="glass-desc">...</div>
                        <div style="font-size: 10px; color: var(--text-muted); margin-top: 4px;">
                            <span>Views: <b id="dlStatsViews" style="color:var(--text-title);">0</b></span> · 
                            <span>Likes: <b id="dlStatsLikes" style="color:var(--text-title);">0</b></span>
                        </div>
                    </div>
                    <div class="glass-actions-row">
                        <button id="dlVideoBtn" class="dl-pill-btn" title="Standard MP4">
                            <svg viewBox="0 0 24 24"><path d="M4 15v3h16v-3H4zm2-5h3V2h6v8h3L12 16 6 10z"/></svg>
                            <span>MP4</span>
                        </button>
                        <button id="dlHDBtn" class="dl-pill-btn" title="HD Quality">
                            <svg viewBox="0 0 24 24"><path d="M5 4h3v5h8V4h3v16h-3v-5H8v5H5V4z"/></svg>
                            <span>HD</span>
                        </button>
                        <button id="dlMusicBtn" class="dl-pill-btn" style="padding: 8px;" title="Audio MP3">
                            <svg viewBox="0 0 24 24"><path d="M12 3v9.28a4.39 4.39 0 0 0-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.2-1.75 4.45-4H15V6h4V3h-7z"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden compatibility elements -->
    <div id="loginView" style="display: none;"></div>
    <div id="telegramView" style="display: none;"></div>

    <script src="popup.js"></script>
</body>
</html>
